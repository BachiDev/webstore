# Automated dependency updates (npm + GitHub Actions).
# Security patches (e.g. Next.js CVEs enforced by Firebase Hosting at deploy
# time) arrive as PRs instead of failing the deploy pipeline.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
