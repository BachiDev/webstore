# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No preview deploy for Dependabot PRs: bot runs can't access the
      # service-account secret, and version bumps only need the CI signal.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.actor != 'dependabot[bot]'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACHIDEV_WEBSTORE }}
          projectId: bachidev-webstore
          # Pinned: see merge workflow (firebase-tools 15.x breaks the build).
          firebaseToolsVersion: 14.27.0
          # Same cleanup-policy auto-approval as the merge workflow.
          force: true
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
